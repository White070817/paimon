name: Build Paimon Desktop Pet

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install pyinstaller


    - name: Build EXE
      shell: pwsh
      run: |
        python -m PyInstaller --name PaimonDesktopPet --onefile --windowed main.py


    - name: Prepare Assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist/assets
        Copy-Item assets/pet.png dist/assets/pet.png


    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PaimonDesktopPet
        path: dist
